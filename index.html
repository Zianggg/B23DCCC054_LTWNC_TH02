<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Theo dõi hạn nộp bài tập: ghim bài quan trọng, lọc, tìm kiếm và xem thống kê theo môn." />
    <title>Deadline Tracker — B23DCCC054</title>
    <script>
      // Đặt theme trước khi React mount để không nháy giao diện sáng → tối. Cùng khoá với ThemeContext.
      ;(function () {
        try {
          var stored = localStorage.getItem('deadline-tracker-theme')
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
